<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="card-title mb-0">{{ title }}</h5>
        <small class="text-muted" ng-if="isEdit">Editing #{{ employeeId }}</small>
      </div>
      <button class="btn btn-outline-secondary" ng-click="cancel()" ng-disabled="loading">Back</button>
    </div>

    <div ng-if="error" class="alert alert-danger">{{ error }}</div>

    <form ng-submit="save()" novalidate>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input
          class="form-control"
          type="text"
          ng-model="model.Name"
          placeholder="e.g., Andi"
          required
          ng-disabled="loading"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Position</label>
        <input
          class="form-control"
          type="text"
          ng-model="model.Position"
          placeholder="e.g., Developer"
          ng-disabled="loading"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Salary</label>
        <input
          class="form-control"
          type="number"
          min="1"
          step="0.01"
          ng-model="model.Salary"
          placeholder="e.g., 7500000"
          required
          ng-disabled="loading"
        />
        <div class="form-text">Must be a number greater than 0.</div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit" ng-disabled="loading">
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
        <button class="btn btn-outline-secondary" type="button" ng-click="cancel()" ng-disabled="loading">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
